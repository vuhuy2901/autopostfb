active_post_folder: posts/sample_post
groups_file: config/groups.txt
max_posts_per_run: 30
delay_between_groups:
  min_seconds: 50
  max_seconds: 85
break_after_posts:
  count: 6
  duration_min_seconds: 180
  duration_max_seconds: 300
  browse_newsfeed_during_break: true
anti_duplicate:
  use_spintax: false
  inject_zero_width: false
  mutate_image_hash: true
  append_random_signature: true
  simulate_typo_and_fix: true
  random_group_engagement: true
repost_cooldown_hours: 20
browser:
  headless: false
  user_data_dir: chrome_profile
